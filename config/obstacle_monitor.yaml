obstacle_monitor:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link

    cloud_topic: /hokuyo3d/hokuyo_cloud2
    plan_topic: /plan
    stop_topic: /wizurg/obstacle_stop_cmd_vel

    # --- 障害物点の抽出 ---
    min_range: 0.3   # センサからの水平距離 [m]
    max_range: 8.0
    # 床の高さ (robot_base_frame 基準) [m]。wizurg は base_link が床から 0.068 m 上
    ground_z: -0.068
    # 床からこの高さの範囲の点を障害物とする [m]。
    # 下限を下げすぎると上り坂の路面を障害物と誤検出する。
    min_obstacle_height: 0.10
    max_obstacle_height: 1.5
    # 自車体の点を除く範囲 (robot_base_frame 基準, nav2 の footprint と同じ) [m]
    footprint_min_x: -0.535
    footprint_max_x: 0.195
    footprint_half_width: 0.29
    self_filter_margin: 0.05

    # --- 障害物メモリ (地図座標のセル) ---
    cell_size: 0.1
    # 視野内にあるのにこの時間点が出なければ「居なくなった」として消す [s]。
    # 点群は 1 フレームではまばらなので、数フレーム分の余裕を持たせる。
    observed_clear_time: 1.0
    # 視野外 (近くの低い物が -5° より下に外れた死角など) のセルはこの時間で忘れる [s]。
    # 短すぎると目の前の低いロボットを忘れて発進する。
    memory_timeout: 8.0
    # センサの視野 (YVT-35LX: 垂直 -5°〜+35°, 水平 210°)
    sensor_min_elevation_deg: -5.0
    sensor_horizontal_fov_deg: 210.0
    visibility_margin_deg: 1.0

    # --- 停止判定 ---
    block_confirm_count: 2    # 連続でこのフレーム数塞がれていたら停止する
    resume_delay: 0.1         # 経路が空いてからこの時間待って再開する [s]
    sensor_timeout: 0.5       # 点群がこの時間届かなければ停止する [s] (プランがある間のみ)

    # --- 検出範囲 (ウェイポイントの属性ごと) ---
    # waypoint_manager が、いま走っている区間 (最後に到着したウェイポイントから次まで) の属性と
    # そのウェイポイント個別の上書き値 (属性の zone_<項目>) を zone_topic に出し続け、
    # obstacle_monitor は zone.<属性>.<項目> に個別の上書きを重ねた範囲を使う。
    # 指令が zone_timeout 途絶えたとき (ウェイポイント走行していないときなど) は normal を使う。
    # 項目:
    #   stop_distance / stop_distance_back      停止判定の範囲 (検出帯) の前方 / 後方の長さ [m] (プランに沿って)
    #   path_clearance_left / _right            検出帯の左 / 右の幅 [m] (中心線から。左右は進行方向から見た向き)
    #   min_blocking_cells                      検出帯のセルがこの数以上で「塞がれている」とする
    #   deadband_left_ratio / _right_ratio      不感帯 (無視する範囲) の左 / 右の幅。その側の検出帯の幅に対する割合 (0〜1)。
    #                                           割合 1.0 の側は停止判定しない。不感帯の中では人も見えなくなる
    #   costmap_margin                          不感帯の外側で local_costmap に入れない幅 [m] (停止判定には使う)
    #   lookahead / lookbehind                  不感帯・costmap 除外の前方 / 後方の長さ [m] (プランに沿って)
    # 後方はプランをさかのぼり、足りなければ最初の区間の向きのまま後ろへ延ばす。
    # 後方・左右を広げると、横や斜め後ろから追い抜いてくるものが車体の横に並んだ時点で止まる
    # (ただし YVT は水平 ±105° しか見えないため、車体の真横より後ろは見えない)。
    # GUI の「障害物検出設定」で、ロボットのモデル上に帯を描きながら変更できる。
    zone_topic: /wizurg/obstacle_zone
    zone_timeout: 1.0          # 指令がこの時間途絶えたら normal の設定に戻す [s]
    # normal: 不感帯・costmap 除外なし
    zone.normal.stop_distance: 2.0
    zone.normal.stop_distance_back: 0.0
    zone.normal.path_clearance_left: 0.45
    zone.normal.path_clearance_right: 0.45
    zone.normal.min_blocking_cells: 2
    zone.normal.deadband_left_ratio: 0.0
    zone.normal.deadband_right_ratio: 0.0
    zone.normal.costmap_margin: 0.0
    zone.normal.lookahead: 6.0
    zone.normal.lookbehind: 1.0
    # slow: 不感帯・costmap 除外なし
    zone.slow.stop_distance: 2.0
    zone.slow.stop_distance_back: 0.0
    zone.slow.path_clearance_left: 0.45
    zone.slow.path_clearance_right: 0.45
    zone.slow.min_blocking_cells: 2
    zone.slow.deadband_left_ratio: 0.0
    zone.slow.deadband_right_ratio: 0.0
    zone.slow.costmap_margin: 0.0
    zone.slow.lookahead: 6.0
    zone.slow.lookbehind: 1.0
    # stop: 不感帯・costmap 除外なし
    zone.stop.stop_distance: 2.0
    zone.stop.stop_distance_back: 0.0
    zone.stop.path_clearance_left: 0.45
    zone.stop.path_clearance_right: 0.45
    zone.stop.min_blocking_cells: 2
    zone.stop.deadband_left_ratio: 0.0
    zone.stop.deadband_right_ratio: 0.0
    zone.stop.costmap_margin: 0.0
    zone.stop.lookahead: 6.0
    zone.stop.lookbehind: 1.0
    # wait: 不感帯・costmap 除外なし
    zone.wait.stop_distance: 2.0
    zone.wait.stop_distance_back: 0.0
    zone.wait.path_clearance_left: 0.45
    zone.wait.path_clearance_right: 0.45
    zone.wait.min_blocking_cells: 2
    zone.wait.deadband_left_ratio: 0.0
    zone.wait.deadband_right_ratio: 0.0
    zone.wait.costmap_margin: 0.0
    zone.wait.lookahead: 6.0
    zone.wait.lookbehind: 1.0
    # pass_through: 通路に張り出した枝葉など。左側を不感帯にし、右側から来る人では止まる
    zone.pass_through.stop_distance: 2.0
    zone.pass_through.stop_distance_back: 0.0
    zone.pass_through.path_clearance_left: 0.45
    zone.pass_through.path_clearance_right: 0.45
    zone.pass_through.min_blocking_cells: 2
    zone.pass_through.deadband_left_ratio: 1.0
    zone.pass_through.deadband_right_ratio: 0.0
    zone.pass_through.costmap_margin: 0.35
    zone.pass_through.lookahead: 6.0
    zone.pass_through.lookbehind: 1.0

    # --- costmap 用の出力 ---
    # local_costmap は memory_cloud (記憶している障害物セル) で障害物を書き込み、
    # costmap_scan_topic (全ビーム +inf) で消去する。
    # global_costmap には障害物を入れない (marking/clearing とも空の点群)。観測ソースが途絶えると
    # Nav2 がプランニングを止めるため、空でも出し続ける。
    # トピック名は nav2_params.yaml の obstacle_layer と合わせること。
    costmap_marking_topic: /obstacle_monitor/static_cloud
    costmap_clearing_topic: /obstacle_monitor/clearing_cloud
    costmap_scan_topic: /obstacle_monitor/filtered_scan

    # RViz 用マーカー (obstacle_monitor/markers) を出すか
    publish_markers: true
    publish_rate: 10.0
