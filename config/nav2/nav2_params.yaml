controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0  # コストマップの高速化に合わせて20Hzに復帰
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    odom_topic: /rsf/lio_imu_rate_odom
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False  # デバッグ出力OFFで軽量化
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.8
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.56
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 10      # サンプル数を削って軽量化
      vy_samples: 1       # サンプル数を削って軽量化
      vtheta_samples: 10  # サンプル数を削って軽量化
      sim_time: 2.0       # シミュレーション時間を短縮
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      track_unknown_space: false
      rolling_window: true
      width: 6.0              # 範囲を6mに縮小して計算コストを削減
      height: 6.0             # 範囲を6mに縮小して計算コストを削減
      resolution: 0.1
      robot_radius: 0.3
      update_frequency: 20.0  # 応答性を上げるため20Hzに高速化
      publish_frequency: 10.0 # 可視化頻度は抑えて負荷をセーブ
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        enabled: true
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.8
      obstacle_layer:
        enabled: true
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /hokuyo3d/scan
          sensor_frame: yvt
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 3.5  # センサーの最大監視レンジを3.5mに短縮
          obstacle_min_range: 0.3
          raytrace_max_range: 4.0  # レイトレースレンジも短縮
          min_obstacle_height: -0.5
          max_obstacle_height: 1.5
          observation_persistence: 0.0
          expected_update_rate: 0.08

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    odom_topic: /rsf/lio_imu_rate_odom
    expected_planner_frequency: 5.0  # グローバルプランナーの頻度を下げて軽量化
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0  # 周期を下げて軽量化
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 10  # 頻度を下げて軽量化
    stop_on_failure: false