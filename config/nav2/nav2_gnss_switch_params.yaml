controller_server:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: True
    odom_topic: /odometry/switch_on_map

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]    

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      track_unknown_space: true
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      robot_radius: 0.5
      update_frequency: 10.0
      publish_frequency: 2.0
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        enabled: true
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      obstacle_layer:
        enabled: true
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth_cloud
        depth_cloud:
          topic: /hokuyo3d/hokuyo_cloud2
          sensor_frame: yvt  # センサーフレーム（TFで定義されているもの）
          data_type: PointCloud2
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 25.0
          obstacle_min_range: 0.5
          raytrace_max_range: 28.0
          min_obstacle_height: -0.5
          max_obstacle_height: 1.5
          observation_persistence: 0.0
          expected_update_rate: 0.05

behavior_server:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/switch_on_map

planner_server:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/switch_on_map