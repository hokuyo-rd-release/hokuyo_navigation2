controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: /odometry/switch_on_map
    controller_plugins: ["FollowPath"]    
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6


local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      track_unknown_space: true
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: laserscan
        laserscan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 12.0
          raytrace_max_range: 14.0
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5

behavior_server:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/switch_on_map

planner_server:
  ros__parameters:
    odom_topic: /odometry/switch_on_map
